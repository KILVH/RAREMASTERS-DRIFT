<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPB Drift — fixed</title>

<style>
body { margin:0; overflow:hidden; background:#000; }

canvas { display:block; }

/* 📱 КНОПКИ — РАЗНЕСЕНЫ И НЕ ЛЕЗУТ */
#leftControls{
 position:fixed;
 bottom:40px;
 left:20px;
 display:flex;
 flex-direction:column;
 gap:20px;
 z-index:9999;
}

#rightControls{
 position:fixed;
 bottom:40px;
 right:20px;
 display:flex;
 flex-direction:column;
 gap:20px;
 z-index:9999;
}

.controlBtn{
 width:110px;
 height:110px;
 font-size:40px;
 border:none;
 border-radius:20px;
 background:rgba(255,255,255,0.25);
 color:white;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="leftControls">
  <button class="controlBtn" id="left">◀</button>
  <button class="controlBtn" id="right">▶</button>
</div>

<div id="rightControls">
  <button class="controlBtn" id="gas">▲</button>
  <button class="controlBtn" id="brake">▼</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const zoom = 0.5;

function resize(){
 canvas.width = innerWidth;
 canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

let keys={};
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

function bindBtn(id,key){
 let el=document.getElementById(id);
 el.addEventListener("touchstart",e=>{e.preventDefault(); keys[key]=true;});
 el.addEventListener("touchend",e=>{e.preventDefault(); keys[key]=false;});
}
bindBtn("left","ArrowLeft");
bindBtn("right","ArrowRight");
bindBtn("gas","ArrowUp");
bindBtn("brake","ArrowDown");

// ===== ASSETS =====
const mapImg=new Image();
const colImg=new Image();
const carImg=new Image();
const policeImg=new Image();

mapImg.src="map.png";
colImg.src="map_collision.png";
carImg.src="zhiga.png";
policeImg.src="police.png";

let ready=0;
mapImg.onload=()=>ready++;
carImg.onload=()=>ready++;
policeImg.onload=()=>ready++;

let colData,colW,colH;
colImg.onload=()=>{
 let c=document.createElement("canvas");
 let ct=c.getContext("2d");
 c.width=colImg.width;
 c.height=colImg.height;
 ct.drawImage(colImg,0,0);
 colData=ct.getImageData(0,0,c.width,c.height).data;
 colW=c.width; colH=c.height;
 ready++;
};

// ===== ЗВУК =====
let audioCtx, engineOsc, engineGain, sirenOsc, sirenGain;

canvas.addEventListener("click",()=>{
 if(audioCtx) return;
 audioCtx=new AudioContext();

 engineOsc=audioCtx.createOscillator();
 engineOsc.type="triangle";
 engineGain=audioCtx.createGain();
 engineOsc.connect(engineGain).connect(audioCtx.destination);
 engineOsc.start();

 sirenOsc=audioCtx.createOscillator();
 sirenOsc.type="sine";
 sirenGain=audioCtx.createGain();
 sirenOsc.connect(sirenGain).connect(audioCtx.destination);
 sirenOsc.start();
});

// ===== МИР =====
const W=8192,H=8192;

function isWall(x,y){
 if(!colData) return false;
 let px=Math.floor(x/W*colW);
 let py=Math.floor(y/H*colH);
 if(px<0||py<0||px>=colW||py>=colH) return true;
 return colData[(py*colW+px)*4]<100;
}

function slide(x,y,vx,vy){
 let nx=x+vx, ny=y+vy;
 if(!isWall(nx,ny)) return {x:nx,y:ny,vx,vy};
 if(!isWall(x+vx,y)) return {x:x+vx,y:y,vx:vx,vy:0};
 if(!isWall(x,y+vy)) return {x:x,y:y+vy,vx:0,vy:vy};
 return {x:x,y:y,vx:0,vy:0};
}

// ===== GAME =====
let car,camera={x:0,y:0},cops=[],marks=[],smoke=[];
let driftScore=0;

function spawn(){
 for(let i=0;i<50000;i++){
  let x=Math.random()*W,y=Math.random()*H;
  if(!isWall(x,y)) return {x,y};
 }
 return {x:4000,y:4000};
}

function reset(){
 let s=spawn();
 car={x:s.x,y:s.y,angle:0,vx:0,vy:0};
 cops=[]; marks=[]; smoke=[];
 driftScore=0;
}

function update(){

 let fx=Math.cos(car.angle), fy=Math.sin(car.angle);

 if(keys["ArrowUp"]){ car.vx+=fx*0.25; car.vy+=fy*0.25; }
 if(keys["ArrowDown"]){ car.vx-=fx*0.2; car.vy-=fy*0.2; }

 let speed=Math.hypot(car.vx,car.vy);

 let velA=Math.atan2(car.vy,car.vx);
 let diff=Math.abs(Math.atan2(Math.sin(velA-car.angle),Math.cos(velA-car.angle)));

 let drifting = diff>0.6 && speed>6;

 if(drifting){
  driftScore+=diff*speed*0.5;

  // следы шин
  let offX=Math.cos(car.angle+Math.PI/2)*12;
  let offY=Math.sin(car.angle+Math.PI/2)*12;

  marks.push({x:car.x+offX,y:car.y+offY,life:200});
  marks.push({x:car.x-offX,y:car.y-offY,life:200});

  // дым отдельно
  smoke.push({x:car.x,y:car.y,life:25,size:10});
 }

 let m=slide(car.x,car.y,car.vx,car.vy);
 car.x=m.x; car.y=m.y;

 // ===== КОПЫ =====
 if(driftScore>1000 && cops.length<3){
  let s=spawn();
  cops.push({x:s.x,y:s.y,hold:0});
 }

 cops.forEach(c=>{
  let dx=car.x-c.x;
  let dy=car.y-c.y;
  let dist=Math.hypot(dx,dy);

  let ang=Math.atan2(dy,dx);
  c.x+=Math.cos(ang)*1.2;
  c.y+=Math.sin(ang)*1.2;

  // 🔥 ЛОВЛЯ
  if(dist<80){
    c.hold++;
    if(c.hold>60){
      reset();
    }
  } else c.hold=0;
 });

 // 🔊 звук
 if(audioCtx){
  engineOsc.frequency.value=50+speed*4;
  engineGain.gain.value=speed/150;

  let t=Date.now()*0.004;
  sirenOsc.frequency.value=700+Math.sin(t)*200;
  sirenGain.gain.value=cops.length?0.05:0;
 }

 camera.x = car.x - canvas.width/(2*zoom);
 camera.y = car.y - canvas.height/(2*zoom);

 // жизнь эффектов
 marks.forEach(m=>m.life--);
 smoke.forEach(s=>s.life--);

 marks = marks.filter(m=>m.life>0);
 smoke = smoke.filter(s=>s.life>0);
}

// ===== DRAW =====
function draw(){
 ctx.fillStyle="#000";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.save();
 ctx.scale(zoom,zoom);
 ctx.translate(-camera.x,-camera.y);

 ctx.drawImage(mapImg,0,0,W,H);

 // следы шин
 marks.forEach(m=>{
  ctx.fillStyle="rgba(0,0,0,"+(m.life/200)+")";
  ctx.fillRect(m.x-3,m.y-3,6,6);
 });

 // дым
 smoke.forEach(s=>{
  ctx.fillStyle="rgba(200,200,200,"+(s.life/25)+")";
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
  ctx.fill();
 });

 // копы
 cops.forEach(c=>{
  ctx.drawImage(policeImg,c.x-40,c.y-80,80,160);
 });

 // машина
 ctx.save();
 ctx.translate(car.x,car.y);
 ctx.rotate(car.angle-Math.PI/2);
 ctx.drawImage(carImg,-45,-90,90,180);
 ctx.restore();

 ctx.restore();

 ctx.fillStyle="white";
 ctx.font="bold 40px Arial";
 ctx.fillText("Drift: "+Math.floor(driftScore),20,50);
}

// ===== LOOP =====
function loop(){
 if(ready<4){ requestAnimationFrame(loop); return; }
 if(!car) reset();

 update();
 draw();

 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
