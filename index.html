<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SPB Drift — FULL BUILD</title>

<style>
body { margin:0; overflow:hidden; background:#000; }

canvas {
 display:block;
 position:relative;
 z-index:1;
}

/* КНОПКИ */
#leftControls{
 position:fixed;
 bottom:30px;
 left:20px;
 display:flex;
 gap:15px;
 z-index:9999;
}

#rightControls{
 position:fixed;
 bottom:30px;
 right:20px;
 display:flex;
 gap:15px;
 z-index:9999;
}

.controlBtn{
 width:80px;
 height:80px;
 font-size:30px;
 border:none;
 border-radius:20px;
 background:rgba(255,255,255,0.25);
 color:white;
}

.controlBtn:active{
 background:rgba(255,255,255,0.5);
}

/* КНОПКА РЕСТАРТА */
#restartBtn{
 position:fixed;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 padding:20px 40px;
 font-size:26px;
 border:none;
 border-radius:15px;
 background:white;
 color:black;
 display:none;
 z-index:10000;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="leftControls">
  <button class="controlBtn" id="left">◀</button>
  <button class="controlBtn" id="right">▶</button>
</div>

<div id="rightControls">
  <button class="controlBtn" id="gas">▲</button>
  <button class="controlBtn" id="brake">▼</button>
</div>

<button id="restartBtn">ЗАНОВО</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restartBtn");

const SCALE = 0.5;

// resize
function resize(){
 canvas.width = innerWidth;
 canvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

// input
let keys={};
addEventListener("keydown",e=>keys[e.key]=true);
addEventListener("keyup",e=>keys[e.key]=false);

// touch
function bindBtn(id,key){
 let el=document.getElementById(id);

 el.addEventListener("touchstart",(e)=>{
   e.preventDefault();
   keys[key]=true;
 });

 el.addEventListener("touchend",(e)=>{
   e.preventDefault();
   keys[key]=false;
 });
}

bindBtn("left","ArrowLeft");
bindBtn("right","ArrowRight");
bindBtn("gas","ArrowUp");
bindBtn("brake","ArrowDown");

// assets
const mapImg=new Image();
const colImg=new Image();
const carImg=new Image();
const policeImg=new Image();

mapImg.src="map.png";
colImg.src="map_collision.png";
carImg.src="zhiga.png";
policeImg.src="police.png";

let ready=0;
mapImg.onload=()=>ready++;
carImg.onload=()=>ready++;
policeImg.onload=()=>ready++;

let colData,colW,colH;
colImg.onload=()=>{
 let c=document.createElement("canvas");
 let ct=c.getContext("2d");
 c.width=colImg.width;
 c.height=colImg.height;
 ct.drawImage(colImg,0,0);
 colData=ct.getImageData(0,0,c.width,c.height).data;
 colW=c.width; colH=c.height;
 ready++;
};

// звук
let audioCtx, engineOsc, engineGain, engineFilter;
let sirenOsc, sirenGain;
let driftNoise, driftGain;

addEventListener("pointerdown",()=>{
 if(audioCtx) return;

 audioCtx=new AudioContext();

 // двигатель
 engineOsc=audioCtx.createOscillator();
 engineOsc.type="triangle";
 engineGain=audioCtx.createGain();
 engineGain.gain.value=0;
 engineFilter=audioCtx.createBiquadFilter();
 engineFilter.type="lowpass";
 engineFilter.frequency.value=1200;

 engineOsc.connect(engineFilter).connect(engineGain).connect(audioCtx.destination);
 engineOsc.start();

 // сирена
 sirenOsc=audioCtx.createOscillator();
 sirenOsc.type="square";
 sirenGain=audioCtx.createGain();
 sirenGain.gain.value=0;
 sirenOsc.connect(sirenGain).connect(audioCtx.destination);
 sirenOsc.start();

 // дрифт шум
 let buffer=audioCtx.createBuffer(1,44100,44100);
 let data=buffer.getChannelData(0);
 for(let i=0;i<44100;i++) data[i]=Math.random()*2-1;

 driftNoise=audioCtx.createBufferSource();
 driftNoise.buffer=buffer;
 driftNoise.loop=true;

 driftGain=audioCtx.createGain();
 driftGain.gain.value=0;

 driftNoise.connect(driftGain).connect(audioCtx.destination);
 driftNoise.start();
});

// мир
const W=8192,H=8192;

function isWall(x,y){
 if(!colData) return false;
 let px=Math.floor(x/W*colW);
 let py=Math.floor(y/H*colH);
 if(px<0||py<0||px>=colW||py>=colH) return true;
 return colData[(py*colW+px)*4]<100;
}

function slide(x,y,vx,vy){
 let nx=x+vx, ny=y+vy;
 if(!isWall(nx,ny)) return {x:nx,y:ny,vx,vy};

 if(!isWall(x+vx,y)) return {x:x+vx,y:y,vx:vx,vy:0};
 if(!isWall(x,y+vy)) return {x:x,y:y+vy,vx:0,vy:vy};

 return {x:x,y:y,vx:0,vy:0};
}

// game
let car,camera={x:0,y:0},cops=[],smoke=[],marks=[];
let driftScore=0;
let gameOver=false;
let throttle=0;

function spawn(){
 for(let i=0;i<50000;i++){
  let x=Math.random()*W,y=Math.random()*H;
  if(!isWall(x,y)) return {x,y};
 }
 return {x:4000,y:4000};
}

function reset(){
 let s=spawn();
 car={x:s.x,y:s.y,angle:0,vx:0,vy:0};
 cops=[]; smoke=[]; marks=[];
 driftScore=0;
 throttle=0;
 gameOver=false;
 restartBtn.style.display="none";
}

restartBtn.onclick=reset;

function wrap(a){ return Math.atan2(Math.sin(a),Math.cos(a)); }

function update(){
 if(gameOver) return;

 let fx=Math.cos(car.angle), fy=Math.sin(car.angle);

 let target=keys["ArrowUp"]?1:0;
 throttle+=(target-throttle)*0.08;

 let accel=0.24*throttle;
 car.vx+=fx*accel;
 car.vy+=fy*accel;

 if(keys["ArrowDown"]){
  car.vx-=fx*0.25;
  car.vy-=fy*0.25;
 }

 let forward=car.vx*fx+car.vy*fy;
 let sideX=car.vx-fx*forward;
 let sideY=car.vy-fy*forward;

 if(!keys["ArrowUp"]) forward*=0.94;
 else forward*=0.992;

 sideX*=0.985;
 sideY*=0.985;

 car.angle+=sideX*0.0038;

 car.vx=fx*forward+sideX;
 car.vy=fy*forward+sideY;

 let speed=Math.hypot(car.vx,car.vy);

 if(speed>14){
  car.vx*=14/speed;
  car.vy*=14/speed;
 }

 let turn=0.04+speed*0.0015;
 if(keys["ArrowLeft"]) car.angle-=turn;
 if(keys["ArrowRight"]) car.angle+=turn;

 let m=slide(car.x,car.y,car.vx,car.vy);
 car.x=m.x; car.y=m.y;
 car.vx=m.vx; car.vy=m.vy;

 let velA=Math.atan2(car.vy,car.vx);
 let diff=Math.abs(wrap(velA-car.angle));
 let drifting=diff>0.5 && speed>6;

 if(drifting){
  driftScore+=diff*speed*0.4;
  smoke.push({x:car.x,y:car.y,life:30,size:8+Math.random()*6});

  let offX=Math.cos(car.angle+Math.PI/2)*10;
  let offY=Math.sin(car.angle+Math.PI/2)*10;

  marks.push({x:car.x+offX,y:car.y+offY,life:120});
  marks.push({x:car.x-offX,y:car.y-offY,life:120});
 }

 // затухание
 smoke.forEach(s=>s.life--);
 smoke=smoke.filter(s=>s.life>0);
 marks.forEach(m=>m.life--);
 marks=marks.filter(m=>m.life>0);

 // звук
 if(audioCtx){
  let speed=Math.hypot(car.vx,car.vy);

  engineOsc.frequency.value=40+speed*4;
  engineGain.gain.value=Math.min(0.08,speed/180);

  let driftVol = drifting ? Math.min(0.15,diff) : 0;
  driftGain.gain.value += (driftVol-driftGain.gain.value)*0.1;

  if(cops.length>0){
    let t=performance.now()*0.005;
    sirenOsc.frequency.value=600+Math.sin(t)*200;
    sirenGain.gain.value=0.05;
  }else{
    sirenGain.gain.value=0;
  }
 }

 // копы
 if(driftScore>1000 && cops.length<3){
  let s=spawn();
  cops.push({x:s.x,y:s.y,vx:0,vy:0,angle:0});
 }

 cops.forEach(c=>{
  let dx=car.x-c.x;
  let dy=car.y-c.y;
  let ang=Math.atan2(dy,dx);

  c.angle+=(wrap(ang-c.angle))*0.15;

  c.vx+=Math.cos(c.angle)*1.1;
  c.vy+=Math.sin(c.angle)*1.1;

  c.vx*=0.9;
  c.vy*=0.9;

  let mc=slide(c.x,c.y,c.vx,c.vy);
  c.x=mc.x; c.y=mc.y;

  let dist=Math.hypot(car.x-c.x,car.y-c.y);
  if(dist<60){
    gameOver=true;
    restartBtn.style.display="block";
  }
 });

 camera.x=car.x-(canvas.width/(2*SCALE));
 camera.y=car.y-(canvas.height/(2*SCALE));
}

function draw(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.scale(SCALE,SCALE);
 ctx.translate(-camera.x,-camera.y);

 ctx.drawImage(mapImg,0,0,W,H);

 marks.forEach(m=>{
  ctx.fillStyle="rgba(0,0,0,"+(m.life/120)+")";
  ctx.fillRect(m.x-3,m.y-3,6,6);
 });

 smoke.forEach(s=>{
  ctx.fillStyle="rgba(180,180,180,"+(s.life/30)*0.3+")";
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
  ctx.fill();
 });

 cops.forEach(c=>{
  ctx.save();
  ctx.translate(c.x,c.y);
  ctx.rotate(c.angle-Math.PI/2);
  ctx.drawImage(policeImg,-50,-100,100,200);
  ctx.restore();
 });

 ctx.save();
 ctx.translate(car.x,car.y);
 ctx.rotate(car.angle-Math.PI/2);
 ctx.drawImage(carImg,-45,-90,90,180);
 ctx.restore();

 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle="white";
 ctx.font="bold 40px Arial";
 ctx.fillText("Drift: "+Math.floor(driftScore),20,50);

 if(gameOver){
  ctx.fillStyle="rgba(0,0,0,0.6)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="white";
  ctx.font="bold 60px Arial";
  ctx.fillText("BUSTED 🚓", canvas.width/2-160, canvas.height/2-40);
 }
}

function loop(){
 if(ready<4){ requestAnimationFrame(loop); return; }
 if(!car) reset();

 update();
 draw();

 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
